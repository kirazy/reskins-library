[mod-setting-description]
reskins-lib-icon-tier-labeling=Visar färgade staplar på ikoner för att ange nivå.
reskins-lib-icon-tier-labeling-style=Ställer in nivåmarkeringarnas stil.
reskins-lib-tier-mapping=Ställer in hur byggnader och föremål delas in i nivåer.\n\n[font=default-semibold]Traditionell[/font]: nivåindelningen följer namnen. Nummer 1, 2 och 3 i en serie motsvarar nivå 1, 2 och 3, och så vidare.\nTill exempel börjar kärnreaktorer på nivå 1.\n\n[font=default-semibold]Progression[/font]: nivåindelningen följer spelets utveckling. Föremål som fås senare och kräver mer komplexa material börjar på högre nivåer.\nTill exempel börjar kärnreaktorer på nivå 3.
reskins-lib-customize-tier-colors=[img=utility.warning_icon] Egna färger använder många bildlager för föremål och objekt, vilket kraftigt ökar antalet spritebilder på skärmen. Det kan försämra prestandan.\n\nAktiverar anpassning av nivåernas färger med färgväljarna nedan.
reskins-lib-custom-colors-tier-0=Ställer in färgen för nivå 0.
reskins-lib-custom-colors-tier-1=Ställer in färgen för nivå 1.
reskins-lib-custom-colors-tier-2=Ställer in färgen för nivå 2.
reskins-lib-custom-colors-tier-3=Ställer in färgen för nivå 3.
reskins-lib-custom-colors-tier-4=Ställer in färgen för nivå 4.
reskins-lib-custom-colors-tier-5=Ställer in färgen för nivå 5.
reskins-lib-custom-colors-tier-6=Ställer in färgen för nivå 6.
reskins-lib-scope-entities=Aktiverar nya utseenden för byggnader, robotar och fordon.
reskins-lib-scope-equipment=Aktiverar nya utseenden för utrustning.
reskins-lib-scope-items-and-fluids=Aktiverar nya utseenden för föremål, vätskor och tillhörande recept.
reskins-lib-scope-technologies=Aktiverar nya utseenden för teknologier.
reskins-lib-scope-interface=Aktiverar nya utseenden för tillverkningsflikar.

reskins-lib-display-notifications=Tillåter att meddelanden om uppdateringar och saknade Artisanal Reskins-moddar visas.

